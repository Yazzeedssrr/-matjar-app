<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a0d">
  <title>مَخْرَج | MAKHRAJ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/makhraj-theme.css">
  <link rel="stylesheet" href="assets/makhraj-app.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div><strong>مَخْرَج</strong><div class="tiny">دائمًا هناك مخرج</div></div>
      </div>
      <button class="pillbtn" id="cartTopBtn" type="button">السلة · <span id="cartCount">0</span></button>
    </header>

    <section id="homeView">
      <section class="hero">
        <div class="tiny">MAKHRAJ STORE</div>
        <h1>اختيارات حقيقية، بتجربة أبسط.</h1>
        <p>تصفح المنتجات المتاحة فعلًا، اختر التفاصيل المناسبة، وأكمل طلبك من حسابك بأمان.</p>
        <div class="need-cta">
          <button class="primary" id="smartPickBtn">ساعدني أختار</button>
          <button class="secondary" id="accountHeroBtn">حسابي</button>
        </div>
      </section>

      <div class="searchbar">
        <input id="searchInput" class="field" placeholder="ابحث عن منتج…" autocomplete="off">
        <button class="iconbtn" id="refreshBtn" aria-label="تحديث">↻</button>
      </div>

      <div id="categoryChips" class="chips"></div>

      <div class="section">
        <h2>المنتجات</h2>
        <span id="productCount" class="tiny"></span>
      </div>
      <div id="productGrid" class="grid">
        <div class="loading">جارٍ تحميل المنتجات…</div>
      </div>
    </section>

    <section id="ordersView" class="hidden">
      <div class="section"><h2>طلباتي</h2><span class="tiny">طلبات حسابك</span></div>
      <div id="ordersList"></div>
    </section>

    <section id="accountView" class="hidden">
      <div class="section"><h2>حسابي</h2><span class="tiny">الحساب والعناوين</span></div>
      <div id="accountContent"></div>
    </section>
  </main>

  <nav class="bottom" aria-label="التنقل">
    <button class="on" data-view="home"><b>⌂</b>الرئيسية</button>
    <button data-action="focus-search"><b>⌕</b>بحث</button>
    <button data-action="smart"><b>✦</b>اختيار ذكي</button>
    <button data-view="orders"><b>▣</b>طلباتي</button>
    <button data-view="account"><b>♙</b>حسابي</button>
  </nav>

  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="panel" id="sheetPanel"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/makhraj-config.js"></script>
  <script src="assets/makhraj-app.js"></script>
</body>
</html>
