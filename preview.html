<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مَخْرَج | MAKHRAJ</title><meta name="theme-color" content="#070a0d"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/makhraj-theme.css"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}.app{max-width:620px;margin:auto;padding:18px 18px 116px}.top{position:sticky;top:0;z-index:6;padding:10px 0;background:#070a0de8;backdrop-filter:blur(16px)}.flex,.brand,.logo,.section,.qty,.line,.badges{display:flex;align-items:center}.brand,.section,.line{justify-content:space-between}.logo{gap:10px}.light{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fff 0 8%,#f4d783 10%,#252c33 35%,#050607 69%);box-shadow:0 0 32px #f4d78355}.name{font-size:22px;font-weight:900}.sub,.tiny{font-size:11px;color:#9ca6b0}.cart,.iconbtn{border:1px solid #ffffff18;background:#121820;color:#fff;padding:11px 13px;border-radius:15px}.hero{margin-top:18px;padding:30px 22px;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:#f3d78116;left:-65px;top:-65px;filter:blur(8px)}.hero h1{font-size:32px;margin:0 0 8px}.muted,.hero p{color:#bac2cb;line-height:1.7}.search{display:flex;gap:8px;margin:15px 0}.search input,.field{width:100%;padding:15px;background:#0c1117;border:1px solid #ffffff14;color:white;font-size:16px;border-radius:14px}.chips,.choices,.rail{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.chip,.choice{white-space:nowrap;padding:10px 14px;border:1px solid #ffffff12;background:#11171e;color:#dce1e6;border-radius:999px}.chip.active,.choice.active{background:#f3d781;color:#151515}.section{margin:25px 2px 12px}.section h2{margin:0;font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.product{overflow:hidden;position:relative}.photo{height:165px;background:linear-gradient(145deg,#222b35,#0b0e12);display:grid;place-items:center;font-size:45px}.info{padding:13px}.info h3{margin:3px 0 5px;font-size:15px}.price{font-weight:900;color:#f3d781}.old{text-decoration:line-through;color:#7e8790;font-size:12px}.add,.checkout{width:100%;margin-top:10px;padding:13px;border:0;background:#f3d781;color:#111;font-weight:900;border-radius:14px}.secondary{width:100%;margin-top:9px;padding:12px;border:1px solid #ffffff18;background:#171e26;color:#fff;font-weight:800;border-radius:14px}.heart{position:absolute;top:9px;left:9px;width:36px;height:36px;border:0;border-radius:50%;background:#080b0ed0;color:#fff;font-size:18px}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#ffffff10;color:#d9dee3}.badges{gap:6px;flex-wrap:wrap;margin:8px 0}.rating{color:#f3d781;font-size:13px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);padding:12px 10px calc(12px + env(safe-area-inset-bottom));background:#090c10f2;backdrop-filter:blur(18px);border-top:1px solid #ffffff12;display:flex;justify-content:space-around}.nav button{background:none;border:0;color:#aab3bd;font-size:11px}.nav .on{color:#f3d781}.sheet{display:none;position:fixed;inset:0;z-index:20;background:#000b;align-items:flex-end}.sheet.open{display:flex}.panel{width:min(620px,100%);margin:auto;background:#11171e;border-radius:28px 28px 0 0;padding:20px;max-height:90vh;overflow:auto}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #ffffff12}.close,.mini{background:#242c35;border:0;color:#fff;padding:9px 12px;border-radius:12px}.empty{text-align:center;color:#9da7b1;padding:35px 5px}.qty{gap:8px}.qty button{width:34px;height:34px;border:0;border-radius:10px;background:#242c35;color:#fff}.label{margin:18px 0 8px;font-weight:800}.divider{height:1px;background:#ffffff12;margin:18px 0}.productHero{height:270px;border-radius:22px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:40;background:#171e26;color:#fff;border:1px solid #ffffff18;padding:12px 16px;border-radius:14px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.step{position:relative;padding:0 30px 22px 0;color:#8e98a3}.step:before{content:'';position:absolute;right:5px;top:4px;width:12px;height:12px;border-radius:50%;background:#38424d}.step:after{content:'';position:absolute;right:10px;top:18px;width:2px;height:26px;background:#38424d}.step:last-child:after{display:none}.step.done{color:#fff}.step.done:before{background:#f3d781;box-shadow:0 0 16px #f3d78166}.miniCard{min-width:145px;padding:13px}.miniPhoto{height:85px;display:grid;place-items:center;font-size:32px;background:#0c1117;border-radius:15px}.compare{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.compare>div{padding:14px}.meter{height:6px;background:#242c35;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:#f3d781}.perk{padding:13px;margin:8px 0;border:1px solid #ffffff10;border-radius:16px;background:#0c1117}.success{text-align:center;padding:22px 6px}.success .light{width:84px;height:84px;margin:10px auto 20px}.orderNo{font-size:24px;color:#f3d781;font-weight:900}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="top"><div class="brand"><div class="logo"><div class="light"></div><div><div class="name">مَخْرَج</div><div class="sub">دائمًا هناك مخرج</div></div></div><div class="flex" style="gap:7px"><button class="iconbtn" onclick="compareView()">⇄</button><button class="cart" onclick="openCart()">السلة · <b id="count">0</b></button></div></div></div><section class="hero makhraj-card"><div class="tiny">MAKHRAJ SELECT</div><h1>من العتمة، يبدأ النور.</h1><p>اكتشف اختيارات مصممة لك، قارن بينها، واحفظ ما يعجبك حتى تجد مخرجك المناسب.</p></section><div class="search"><input id="q" placeholder="ابحث بالاسم أو الوصف…"><button class="iconbtn" onclick="sortView()">☷</button></div><div class="chips"><button class="chip active" onclick="filterCat('all',this)">الكل</button><button class="chip" onclick="filterCat('new',this)">جديد</button><button class="chip" onclick="filterCat('popular',this)">الأكثر طلبًا</button><button class="chip" onclick="filterCat('sale',this)">عروض</button><button class="chip" onclick="filterCat('low',this)">كمية محدودة</button></div><div id="recentWrap"></div><div class="section"><h2 id="sectionTitle">مختارات مَخْرَج</h2><span class="muted" id="resultCount"></span></div><div class="grid" id="products"></div></main><nav class="nav"><button class="on" onclick="resetHome()">⌂<br>الرئيسية</button><button onclick="q.focus();scrollTo(0,q.offsetTop-70)">⌕<br>استكشاف</button><button onclick="showFavs()">♡<br>المفضلة</button><button onclick="trackingCenter()">◎<br>التتبع</button><button onclick="accountView()">♙<br>حسابي</button></nav><div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div><div class="toast" id="toast"></div><script>const demo=[{n:'حقيبة يومية',p:29,old:36,e:'👜',d:'حقيبة عملية بتصميم أنيق ومساحة مناسبة للاستخدام اليومي.',cat:['new','popular'],stock:8,r:4.8,reviews:126,colors:['أسود','بني','رملي'],sizes:['صغير','متوسط','كبير'],features:['جيب داخلي','خامة مقاومة للماء','حزام قابل للتعديل']},{n:'ساعة أنيقة',p:39,old:0,e:'⌚',d:'تصميم بسيط بلمسة فاخرة، مناسبة للعمل والمناسبات.',cat:['popular'],stock:4,r:4.9,reviews:89,colors:['أسود','فضي','ذهبي'],sizes:['مقاس موحد'],features:['تصميم خفيف','مقاومة للرذاذ','ضمان تجريبي']},{n:'عطر مميز',p:24,old:30,e:'✨',d:'رائحة هادئة وحضور واضح، متوفرة بأكثر من حجم.',cat:['new','sale'],stock:12,r:4.7,reviews:204,colors:['أصلي'],sizes:['50ml','100ml'],features:['ثبات جيد','تغليف أنيق','مناسب كهدية']},{n:'إكسسوار مختار',p:16,old:21,e:'◆',d:'قطعة مختارة لإكمال التفاصيل الصغيرة بأسلوب بسيط.',cat:['sale'],stock:2,r:4.6,reviews:61,colors:['أسود','ذهبي'],sizes:['مقاس موحد'],features:['خفيف','تصميم بسيط','تغليف هدية']}];let cart=J('makhraj-cart-v5',[]),favs=J('makhraj-favs',[]),orders=J('makhraj-orders',[]),recent=J('makhraj-recent',[]),compare=J('makhraj-compare',[]),profile=J('makhraj-profile',{}),currentCat='all',sort='featured';const count=document.getElementById('count'),products=document.getElementById('products'),q=document.getElementById('q'),sheet=document.getElementById('sheet'),panel=document.getElementById('panel'),toast=document.getElementById('toast');function J(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}function save(){localStorage.setItem('makhraj-cart-v5',JSON.stringify(cart));localStorage.setItem('makhraj-favs',JSON.stringify(favs));localStorage.setItem('makhraj-orders',JSON.stringify(orders));localStorage.setItem('makhraj-recent',JSON.stringify(recent));localStorage.setItem('makhraj-compare',JSON.stringify(compare));localStorage.setItem('makhraj-profile',JSON.stringify(profile));count.textContent=cart.reduce((s,x)=>s+x.q,0)}function notice(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600);if(navigator.vibrate)navigator.vibrate(20)}function visible(){let term=q.value.trim(),a=demo.filter(p=>(currentCat==='all'||(currentCat==='low'?p.stock<=4:p.cat.includes(currentCat)))&&(p.n.includes(term)||p.d.includes(term)));if(sort==='lowprice')a.sort((a,b)=>a.p-b.p);if(sort==='highprice')a.sort((a,b)=>b.p-a.p);if(sort==='rating')a.sort((a,b)=>b.r-a.r);return a}function draw(a=visible()){document.getElementById('resultCount').textContent=a.length+' منتجات';products.innerHTML=a.map(p=>{let i=demo.indexOf(p);return `<article class="product makhraj-card"><button class="heart" onclick="event.stopPropagation();fav(${i})">${favs.includes(i)?'♥':'♡'}</button><div onclick="detail(${i})"><div class="photo">${p.e}</div><div class="info"><div class="rating">★ ${p.r} <span class="tiny">(${p.reviews})</span></div><h3>${p.n}</h3><div class="badges"><span class="badge">${p.stock<=3?'الأخير تقريبًا':p.stock<=5?'متبقي قليل':'متوفر'}</span>${p.old?'<span class="badge">وفر $'+(p.old-p.p)+'</span>':''}</div><span class="price">$${p.p.toFixed(2)}</span> ${p.old?`<span class="old">$${p.old.toFixed(2)}</span>`:''}<button class="add" onclick="event.stopPropagation();detail(${i})">عرض الخيارات</button></div></div></article>`}).join('')||'<div class="empty" style="grid-column:1/-1">لا توجد نتائج. جرّب عبارة أو تصنيفًا آخر.</div>';renderRecent()}function renderRecent(){let w=document.getElementById('recentWrap');if(!recent.length){w.innerHTML='';return}w.innerHTML=`<div class="section"><h2>شاهدتها مؤخرًا</h2><span class="tiny" onclick="recent=[];save();renderRecent()">مسح</span></div><div class="rail">${recent.slice(0,4).map(i=>`<div class="miniCard makhraj-card" onclick="detail(${i})"><div class="miniPhoto">${demo[i].e}</div><b>${demo[i].n}</b><div class="price">$${demo[i].p}</div></div>`).join('')}</div>`}function filterCat(c,b){currentCat=c;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()}function fav(i){favs=favs.includes(i)?favs.filter(x=>x!==i):[...favs,i];save();draw();notice(favs.includes(i)?'حُفظ في المفضلة':'أزيل من المفضلة')}function toggleCompare(i){compare=compare.includes(i)?compare.filter(x=>x!==i):compare.length<2?[...compare,i]:[compare[1],i];save();notice(compare.includes(i)?'أضيف للمقارنة':'أزيل من المقارنة')}function detail(i){let p=demo[i];recent=[i,...recent.filter(x=>x!==i)].slice(0,8);save();window.pick={i,color:p.colors[0],size:p.sizes[0],q:1};panel.innerHTML=`<button class="close" onclick="closeSheet()">✕</button><div class="photo productHero">${p.e}</div><div class="line"><div><h2 style="margin-bottom:4px">${p.n}</h2><div class="rating">★ ${p.r} · ${p.reviews} مراجعة</div></div><div><span class="price" style="font-size:24px">$${p.p.toFixed(2)}</span>${p.old?`<br><span class="old">$${p.old.toFixed(2)}</span>`:''}</div></div><p class="muted">${p.d}</p><div class="badges"><span class="badge">${p.stock} في المخزون</span><span class="badge">استبدال سهل</span><span class="badge">دفع آمن لاحقًا</span></div><div class="label">لماذا قد يعجبك؟</div>${p.features.map(x=>`<div class="perk">✓ ${x}</div>`).join('')}<div class="label">اللون</div><div class="choices">${p.colors.map((x,k)=>`<button class="choice ${k?'':'active'}" onclick="sel(this,'color','${x}')">${x}</button>`).join('')}</div><div class="label">المقاس / الخيار</div><div class="choices">${p.sizes.map((x,k)=>`<button class="choice ${k?'':'active'}" onclick="sel(this,'size','${x}')">${x}</button>`).join('')}</div><div class="label">الكمية</div><div class="qty"><button onclick="pq(-1)">−</button><b id="pq">1</b><button onclick="pq(1)">+</button></div><div class="divider"></div><div class="line"><span class="tiny">شحن مجاني للطلبات فوق $75</span><span class="tiny">المخزون يتحدث عند الطلب الحقيقي</span></div><button class="checkout" onclick="addConfigured()">أضف بخياراتي</button><button class="secondary" onclick="toggleCompare(${i});detail(${i})">${compare.includes(i)?'✓ ضمن المقارنة':'⇄ أضف للمقارنة'}</button><button class="secondary" onclick="shareProduct(${i})">↗ مشاركة المنتج</button>`;sheet.classList.add('open')}function sel(el,k,v){el.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));el.classList.add('active');pick[k]=v}function pq(d){pick.q=Math.max(1,Math.min(demo[pick.i].stock,pick.q+d));document.getElementById('pq').textContent=pick.q}function addConfigured(){let x=cart.find(x=>x.i===pick.i&&x.color===pick.color&&x.size===pick.size);x?x.q+=pick.q:cart.push({...pick});save();notice('أضيف بخياراتك');openCart()}function shareProduct(i){let t=`${demo[i].n} — $${demo[i].p} | مَخْرَج`;navigator.share?navigator.share({title:'مَخْرَج',text:t,url:location.href}):notice('المشاركة متاحة من التطبيق المدعوم')}function compareView(){if(!compare.length){notice('أضف منتجين للمقارنة من صفحة المنتج');return}panel.innerHTML=`<button class="close" onclick="closeSheet()">✕</button><h2>المقارنة</h2><p class="muted">ضع خيارين جنبًا إلى جنب قبل أن تقرر.</p><div class="compare">${compare.map(i=>{let p=demo[i];return `<div class="makhraj-card"><div class="miniPhoto">${p.e}</div><h3>${p.n}</h3><div class="price">$${p.p}</div><p class="rating">★ ${p.r}</p><p class="tiny">المخزون ${p.stock}</p><div class="meter"><i style="width:${p.r/5*100}%"></i></div><button class="secondary" onclick="detail(${i})">التفاصيل</button></div>`}).join('')}</div>`;sheet.classList.add('open')}function change(k,d){cart[k].q+=d;if(cart[k].q<1)cart.splice(k,1);save();openCart()}function subtotal(){return cart.reduce((s,x)=>s+demo[x.i].p*x.q,0)}function shipping(){return subtotal()>=75?0:6}function openCart(){let sub=subtotal(),ship=shipping();panel.innerHTML=`<button class="close" onclick="closeSheet()">✕</button><h2>سلة مَخْرَج</h2>${cart.length?cart.map((x,k)=>`<div class="row"><span>${demo[x.i].e} <b>${demo[x.i].n}</b><br><small class="muted">${x.color} · ${x.size}</small><br><b class="price">$${(demo[x.i].p*x.q).toFixed(2)}</b></span><span class="qty"><button onclick="change(${k},-1)">−</button><b>${x.q}</b><button onclick="change(${k},1)">+</button></span></div>`).join('')+`<div class="perk"><b>${sub>=75?'✓ حصلت على الشحن المجاني':'أضف $'+(75-sub).toFixed(2)+' للشحن المجاني'}</b><div class="meter" style="margin-top:9px"><i style="width:${Math.min(100,sub/75*100)}%"></i></div></div><div class="row"><span>المنتجات</span><b>$${sub.toFixed(2)}</b></div><div class="row"><span>الشحن</span><b>${ship?'$'+ship.toFixed(2):'مجاني'}</b></div><div class="row"><b>الإجمالي</b><b class="price">$${(sub+ship).toFixed(2)}</b></div><button class="checkout" onclick="checkout()">متابعة آمنة للطلب</button>`:'<div class="empty">سلتك فارغة<br><small>المنتجات التي تختارها ستظهر هنا مع كل خياراتها.</small></div>'}`;sheet.classList.add('open')}function checkout(){panel.innerHTML=`<button class="close" onclick="openCart()">←</button><h2>بيانات التوصيل</h2><input class="field" id="cn" placeholder="الاسم الكامل" value="${profile.n||''}"><input class="field" id="cp" inputmode="tel" placeholder="رقم الهاتف" value="${profile.p||''}"><input class="field" id="ca" placeholder="العنوان" value="${profile.a||''}"><input class="field" id="cc" placeholder="المدينة" value="${profile.c||''}"><textarea class="field" id="note" placeholder="تعليمات للسائق / ملاحظات"></textarea><div class="label">طريقة الاستلام</div><div class="choices"><button class="choice active">توصيل</button><button class="choice">استلام لاحقًا</button></div><button class="checkout" onclick="reviewOrder()">مراجعة كل التفاصيل</button>`}function reviewOrder(){let n=cn.value.trim(),p=cp.value.trim(),a=ca.value.trim(),c=cc.value.trim();if(!n||!p||!a||!c){notice('أكمل بيانات التوصيل');return}profile={n,p,a,c};save();window.pending={...profile,note:note.value};panel.innerHTML=`<button class="close" onclick="checkout()">←</button><h2>المراجعة النهائية</h2><div class="perk"><b>${n}</b><br><span class="muted">${p}<br>${a}، ${c}</span></div>${cart.map(x=>`<div class="row"><span>${demo[x.i].n} × ${x.q}<br><small class="muted">${x.color} · ${x.size}</small></span><b>$${(demo[x.i].p*x.q).toFixed(2)}</b></div>`).join('')}<div class="row"><b>الإجمالي</b><b class="price">$${(subtotal()+shipping()).toFixed(2)}</b></div><p class="tiny">هذه نسخة تجربة. لن يتم تحصيل أموال أو إرسال طلب حقيقي.</p><button class="checkout" onclick="placeOrder()">تأكيد الطلب التجريبي</button>`}function placeOrder(){let no='MK-'+String(Date.now()).slice(-6),o={no,phone:pending.p,customer:pending,items:[...cart],total:subtotal()+shipping(),status:1,date:new Date().toISOString()};orders.unshift(o);cart=[];save();panel.innerHTML=`<div class="success"><div class="light"></div><div class="tiny">وصل طلبك إلى النور</div><h2>تم استلام الطلب</h2><div class="orderNo">${no}</div><p class="muted">يمكنك تتبعه من مركز التتبع في أي وقت.</p><button class="checkout" onclick="track('${no}')">تتبع الآن</button></div>`}function trackingCenter(){panel.innerHTML=`<button class="close" onclick="closeSheet()">✕</button><h2>مركز تتبع الطلب</h2><p class="muted">أدخل رقم الطلب والهاتف، أو اختر طلبًا محفوظًا على هذا الجهاز.</p><input class="field" id="tn" placeholder="MK-000000"><input class="field" id="tp" inputmode="tel" placeholder="رقم الهاتف"><button class="checkout" onclick="lookupTrack()">عرض حالة الطلب</button>${orders.length?'<div class="label">طلبات هذا الجهاز</div>'+orders.map(o=>`<div class="row" onclick="track('${o.no}')"><span><b>${o.no}</b><br><small class="muted">${new Date(o.date).toLocaleDateString('ar')}</small></span><span class="price">$${o.total.toFixed(2)}</span></div>`).join(''):''}`;sheet.classList.add('open')}function lookupTrack(){let o=orders.find(x=>x.no.toUpperCase()===tn.value.trim().toUpperCase()&&x.phone===tp.value.trim());o?track(o.no):notice('لم نجد طلبًا مطابقًا على هذا الجهاز')}function track(no){let o=orders.find(x=>x.no===no),steps=['تم إرسال الطلب','تم التأكيد','قيد التجهيز','جاهز للشحن','في الطريق','تم التسليم'];panel.innerHTML=`<button class="close" onclick="trackingCenter()">←</button><h2>${o.no}</h2><div class="perk"><b>الحالة الحالية: ${steps[o.status]}</b><br><span class="tiny">آخر تحديث تجريبي الآن</span></div><div>${steps.map((s,i)=>`<div class="step ${i<=o.status?'done':''}"><b>${s}</b>${i===o.status?'<br><span class="tiny">أنت هنا الآن</span>':''}</div>`).join('')}</div><div class="row"><span>الإجمالي</span><b class="price">$${o.total.toFixed(2)}</b></div>`}function showFavs(){document.getElementById('sectionTitle').textContent='المفضلة';draw(favs.map(i=>demo[i]));scrollTo({top:300,behavior:'smooth'})}function accountView(){panel.innerHTML=`<button class="close" onclick="closeSheet()">✕</button><h2>حسابي</h2><div class="perk"><b>${profile.n||'ضيف مَخْرَج'}</b><br><span class="muted">${profile.p||'أكمل أول طلب لحفظ بياناتك على الجهاز'}</span></div><button class="secondary" onclick="trackingCenter()">طلباتي وتتبعها</button><button class="secondary" onclick="showFavs();closeSheet()">المفضلة</button><button class="secondary" onclick="compareView()">المقارنة</button><p class="tiny">لاحقًا: تسجيل دخول، عناوين متعددة، إشعارات، نقاط، مرتجعات ودعم.</p>`;sheet.classList.add('open')}function sortView(){panel.innerHTML=`<button class="close" onclick="closeSheet()">✕</button><h2>ترتيب النتائج</h2>${[['featured','مختارات مَخْرَج'],['lowprice','السعر: الأقل أولًا'],['highprice','السعر: الأعلى أولًا'],['rating','الأعلى تقييمًا']].map(x=>`<button class="secondary" onclick="sort='${x[0]}';draw();closeSheet()">${x[1]}</button>`).join('')}`;sheet.classList.add('open')}function resetHome(){currentCat='all';q.value='';document.getElementById('sectionTitle').textContent='مختارات مَخْرَج';draw();scrollTo({top:0,behavior:'smooth'})}function closeSheet(){sheet.classList.remove('open')}q.oninput=draw;save();draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
