<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مَخْرَج | MAKHRAJ</title><meta name="theme-color" content="#070a0d"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/makhraj-theme.css"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;min-height:100vh}.app{max-width:620px;margin:auto;padding:18px 18px 105px}.top{position:sticky;top:0;z-index:5;padding:10px 0;background:#070a0de8;backdrop-filter:blur(14px)}.brand,.logo,.section{display:flex;align-items:center}.brand,.section{justify-content:space-between}.logo{gap:10px}.light{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fff 0 8%,#f4d783 10%,#252c33 35%,#050607 69%);box-shadow:0 0 32px #f4d78355}.name{font-size:22px;font-weight:900}.sub{font-size:11px;color:#aab3bd}.cart{border:1px solid #ffffff18;background:#121820;color:#fff;padding:11px 14px}.hero{margin-top:18px;padding:28px 22px}.hero h1{font-size:31px;margin:0 0 8px}.hero p,.muted{color:#bac2cb;line-height:1.7}.search input{width:100%;margin:16px 0;padding:16px;background:#11171e;border:1px solid #ffffff12;color:white;font-size:16px}.chips{display:flex;gap:8px;overflow:auto}.chip{white-space:nowrap;padding:10px 14px;border:1px solid #ffffff12;background:#11171e;color:#dce1e6;border-radius:999px}.chip.active{background:#f3d781;color:#151515}.section{margin:24px 2px 12px}.section h2{margin:0;font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.product{overflow:hidden;position:relative}.photo{height:165px;background:linear-gradient(145deg,#222b35,#0b0e12);display:grid;place-items:center;font-size:45px}.info{padding:13px}.info h3{margin:0 0 5px;font-size:15px}.price{font-weight:900;color:#f3d781}.add,.checkout{width:100%;margin-top:10px;padding:12px;border:0;background:#f3d781;color:#111;font-weight:900}.heart{position:absolute;top:9px;left:9px;width:36px;height:36px;border:0;border-radius:50%;background:#080b0ebd;color:#fff;font-size:18px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#090c10ee;backdrop-filter:blur(16px);border-top:1px solid #ffffff12;display:flex;justify-content:space-around}.nav button{background:none;border:0;color:#aab3bd}.nav .on{color:#f3d781}.sheet{display:none;position:fixed;inset:0;z-index:20;background:#0009;align-items:flex-end}.sheet.open{display:flex}.panel{width:min(620px,100%);margin:auto;background:#11171e;border-radius:28px 28px 0 0;padding:20px;max-height:78vh;overflow:auto}.row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid #ffffff12}.close{float:left;background:#242c35;border:0;color:#fff;padding:9px 12px}.empty{text-align:center;color:#9da7b1;padding:35px 5px}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="top"><div class="brand"><div class="logo"><div class="light"></div><div><div class="name">مَخْرَج</div><div class="sub">دائمًا هناك مخرج</div></div></div><button class="cart" onclick="openCart()">السلة · <b id="count">0</b></button></div></div><section class="hero makhraj-card"><h1>من العتمة، يبدأ النور.</h1><p>متجر مَخْرَج — تجربة تسوق عربية سريعة ومصممة للهاتف.</p></section><div class="search"><input id="q" placeholder="ابحث عن منتج…"></div><div class="chips"><button class="chip active">الكل</button><button class="chip">وصل حديثًا</button><button class="chip">الأكثر طلبًا</button><button class="chip">عروض</button></div><div class="section"><h2>مختارات مَخْرَج</h2><span class="muted">اضغط المنتج للتفاصيل</span></div><div class="grid" id="products"></div></main><nav class="nav"><button class="on">⌂<br>الرئيسية</button><button onclick="q.focus();scrollTo(0,q.offsetTop-70)">⌕<br>استكشاف</button><button onclick="showFavs()">♡<br>المفضلة</button><button>▣<br>طلباتي</button></nav><div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div><script>const demo=[{n:'حقيبة يومية',p:29,e:'👜',d:'حقيبة عملية بتصميم أنيق للاستخدام اليومي.'},{n:'ساعة أنيقة',p:39,e:'⌚',d:'تفاصيل بسيطة ولمسة فاخرة تناسب إطلالتك.'},{n:'عطر مميز',p:24,e:'✨',d:'اختيار مميز بهوية هادئة وحضور واضح.'},{n:'إكسسوار مختار',p:16,e:'◆',d:'قطعة مختارة لإكمال التفاصيل الصغيرة.'}];let cart=JSON.parse(localStorage.getItem('makhraj-cart-v2')||'[]'),favs=JSON.parse(localStorage.getItem('makhraj-favs')||'[]');const count=document.getElementById('count'),products=document.getElementById('products'),q=document.getElementById('q'),sheet=document.getElementById('sheet'),panel=document.getElementById('panel');function save(){localStorage.setItem('makhraj-cart-v2',JSON.stringify(cart));localStorage.setItem('makhraj-favs',JSON.stringify(favs));count.textContent=cart.length}function draw(a=demo){products.innerHTML=a.map(p=>{let i=demo.indexOf(p);return `<article class="product makhraj-card"><button class="heart" onclick="event.stopPropagation();fav(${i})">${favs.includes(i)?'♥':'♡'}</button><div onclick="detail(${i})"><div class="photo">${p.e}</div><div class="info"><h3>${p.n}</h3><div class="price">$${p.p.toFixed(2)}</div><button class="add" onclick="event.stopPropagation();add(${i})">أضف إلى السلة</button></div></div></article>`}).join('')}function add(i){cart.push(i);save()}function fav(i){favs=favs.includes(i)?favs.filter(x=>x!==i):[...favs,i];save();draw(demo.filter(p=>p.n.includes(q.value.trim())))}function detail(i){let p=demo[i];panel.innerHTML=`<button class="close" onclick="closeSheet()">✕</button><div class="photo" style="height:230px;border-radius:20px">${p.e}</div><h2>${p.n}</h2><div class="price" style="font-size:22px">$${p.p.toFixed(2)}</div><p class="muted">${p.d}</p><button class="checkout" onclick="add(${i});openCart()">أضف إلى السلة</button>`;sheet.classList.add('open')}function openCart(){let total=cart.reduce((s,i)=>s+demo[i].p,0);panel.innerHTML=`<button class="close" onclick="closeSheet()">✕</button><h2>سلة مَخْرَج</h2>${cart.length?cart.map((i,x)=>`<div class="row"><span>${demo[i].e} ${demo[i].n}</span><span>$${demo[i].p.toFixed(2)} <button onclick="cart.splice(${x},1);save();openCart()">×</button></span></div>`).join('')+`<div class="row"><b>الإجمالي</b><b class="price">$${total.toFixed(2)}</b></div><button class="checkout" onclick="alert('سيتم ربط إتمام الطلب ببيانات المتجر الحقيقية في المرحلة التالية')">متابعة الطلب</button>`:'<div class="empty">سلتك فارغة الآن</div>'}`;sheet.classList.add('open')}function showFavs(){let a=favs.map(i=>demo[i]);draw(a);scrollTo({top:250,behavior:'smooth'})}function closeSheet(){sheet.classList.remove('open')}q.oninput=()=>draw(demo.filter(p=>p.n.includes(q.value.trim())));save();draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
