<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مَخْرَج | MAKHRAJ</title><meta name="theme-color" content="#070a0d"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/makhraj-theme.css"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;min-height:100vh}.app{max-width:620px;margin:auto;padding:18px 18px 112px}.top{position:sticky;top:0;z-index:6;padding:10px 0;background:#070a0de8;backdrop-filter:blur(14px)}.brand,.logo,.section,.qty,.line,.badges{display:flex;align-items:center}.brand,.section,.line{justify-content:space-between}.logo{gap:10px}.light{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fff 0 8%,#f4d783 10%,#252c33 35%,#050607 69%);box-shadow:0 0 32px #f4d78355}.name{font-size:22px;font-weight:900}.sub{font-size:11px;color:#aab3bd}.cart{border:1px solid #ffffff18;background:#121820;color:#fff;padding:11px 14px}.hero{margin-top:18px;padding:28px 22px}.hero h1{font-size:31px;margin:0 0 8px}.muted,.hero p{color:#bac2cb;line-height:1.7}.search input,.field{width:100%;margin:8px 0;padding:15px;background:#0c1117;border:1px solid #ffffff14;color:white;font-size:16px;border-radius:14px}.chips,.choices{display:flex;gap:8px;overflow:auto}.chip,.choice{white-space:nowrap;padding:10px 14px;border:1px solid #ffffff12;background:#11171e;color:#dce1e6;border-radius:999px}.chip.active,.choice.active{background:#f3d781;color:#151515}.section{margin:24px 2px 12px}.section h2{margin:0;font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.product{overflow:hidden;position:relative}.photo{height:165px;background:linear-gradient(145deg,#222b35,#0b0e12);display:grid;place-items:center;font-size:45px}.info{padding:13px}.info h3{margin:0 0 5px;font-size:15px}.price{font-weight:900;color:#f3d781}.add,.checkout{width:100%;margin-top:10px;padding:13px;border:0;background:#f3d781;color:#111;font-weight:900}.secondary{width:100%;margin-top:9px;padding:12px;border:1px solid #ffffff18;background:#171e26;color:#fff;font-weight:800;border-radius:14px}.heart{position:absolute;top:9px;left:9px;width:36px;height:36px;border:0;border-radius:50%;background:#080b0ebd;color:#fff;font-size:18px}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#ffffff10;color:#d9dee3}.badges{gap:6px;flex-wrap:wrap;margin:8px 0}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#090c10ee;backdrop-filter:blur(16px);border-top:1px solid #ffffff12;display:flex;justify-content:space-around}.nav button{background:none;border:0;color:#aab3bd}.nav .on{color:#f3d781}.sheet{display:none;position:fixed;inset:0;z-index:20;background:#000a;align-items:flex-end}.sheet.open{display:flex}.panel{width:min(620px,100%);margin:auto;background:#11171e;border-radius:28px 28px 0 0;padding:20px;max-height:88vh;overflow:auto}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #ffffff12}.close,.mini{background:#242c35;border:0;color:#fff;padding:9px 12px;border-radius:12px}.empty{text-align:center;color:#9da7b1;padding:35px 5px}.qty{gap:8px}.qty button{width:34px;height:34px;border:0;border-radius:10px;background:#242c35;color:#fff}.success{text-align:center;padding:25px 8px}.success .light{width:82px;height:82px;margin:10px auto 20px}.orderNo{font-size:24px;color:#f3d781;font-weight:900;letter-spacing:1px}.timeline{margin:20px 0}.step{position:relative;padding:0 30px 22px 0;color:#8e98a3}.step:before{content:'';position:absolute;right:5px;top:4px;width:12px;height:12px;border-radius:50%;background:#38424d}.step:after{content:'';position:absolute;right:10px;top:18px;width:2px;height:26px;background:#38424d}.step:last-child:after{display:none}.step.done{color:#fff}.step.done:before{background:#f3d781;box-shadow:0 0 16px #f3d78166}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:40;background:#171e26;color:#fff;border:1px solid #ffffff18;padding:12px 16px;border-radius:14px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.rating{color:#f3d781;font-size:13px}.label{margin:18px 0 8px;font-weight:800}.productHero{height:260px;border-radius:22px}.divider{height:1px;background:#ffffff12;margin:18px 0}.trackbox{padding:16px;border:1px solid #ffffff12;border-radius:18px;background:#0d1218}.tiny{font-size:12px;color:#8d97a1}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="top"><div class="brand"><div class="logo"><div class="light"></div><div><div class="name">مَخْرَج</div><div class="sub">دائمًا هناك مخرج</div></div></div><button class="cart" onclick="openCart()">السلة · <b id="count">0</b></button></div></div><section class="hero makhraj-card"><h1>من العتمة، يبدأ النور.</h1><p>واجهة تسوق عربية بتفاصيل أكثر، خيارات أوضح، وتتبع طلب حقيقي ضمن تجربة واحدة.</p></section><div class="search"><input id="q" placeholder="ابحث بالاسم أو التصنيف…"></div><div class="chips"><button class="chip active" onclick="filterCat('all',this)">الكل</button><button class="chip" onclick="filterCat('new',this)">وصل حديثًا</button><button class="chip" onclick="filterCat('popular',this)">الأكثر طلبًا</button><button class="chip" onclick="filterCat('sale',this)">عروض</button></div><div class="section"><h2>مختارات مَخْرَج</h2><span class="muted">تفاصيل قبل الإضافة</span></div><div class="grid" id="products"></div></main><nav class="nav"><button class="on" onclick="resetHome()">⌂<br>الرئيسية</button><button onclick="q.focus();scrollTo(0,q.offsetTop-70)">⌕<br>استكشاف</button><button onclick="showFavs()">♡<br>المفضلة</button><button onclick="trackingCenter()">◎<br>تتبع الطلب</button></nav><div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div><div class="toast" id="toast"></div><script>const demo=[{n:'حقيبة يومية',p:29,e:'👜',d:'حقيبة عملية بتصميم أنيق ومساحة مناسبة للاستخدام اليومي.',cat:['new','popular'],stock:8,r:4.8,colors:['أسود','بني','رملي'],sizes:['صغير','متوسط','كبير']},{n:'ساعة أنيقة',p:39,e:'⌚',d:'تصميم بسيط بلمسة فاخرة، مناسبة للعمل والمناسبات.',cat:['popular'],stock:4,r:4.9,colors:['أسود','فضي','ذهبي'],sizes:['مقاس موحد']},{n:'عطر مميز',p:24,e:'✨',d:'رائحة هادئة وحضور واضح، متوفرة بأكثر من حجم.',cat:['new','sale'],stock:12,r:4.7,colors:['أصلي'],sizes:['50ml','100ml']},{n:'إكسسوار مختار',p:16,e:'◆',d:'قطعة مختارة لإكمال التفاصيل الصغيرة بأسلوب بسيط.',cat:['sale'],stock:2,r:4.6,colors:['أسود','ذهبي'],sizes:['مقاس موحد']}];let cart=JSON.parse(localStorage.getItem('makhraj-cart-v4')||'[]'),favs=JSON.parse(localStorage.getItem('makhraj-favs')||'[]'),orders=JSON.parse(localStorage.getItem('makhraj-orders')||'[]'),currentCat='all';const count=document.getElementById('count'),products=document.getElementById('products'),q=document.getElementById('q'),sheet=document.getElementById('sheet'),panel=document.getElementById('panel'),toast=document.getElementById('toast');function save(){localStorage.setItem('makhraj-cart-v4',JSON.stringify(cart));localStorage.setItem('makhraj-favs',JSON.stringify(favs));localStorage.setItem('makhraj-orders',JSON.stringify(orders));count.textContent=cart.reduce((s,x)=>s+x.q,0)}function notice(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}function visible(){let term=q.value.trim();return demo.filter(p=>(currentCat==='all'||p.cat.includes(currentCat))&&(p.n.includes(term)||p.d.includes(term)))}function draw(a=visible()){products.innerHTML=a.map(p=>{let i=demo.indexOf(p),stock=p.stock<=3?'كمية محدودة':p.stock<=5?'متبقي قليل':'متوفر';return `<article class="product makhraj-card"><button class="heart" onclick="event.stopPropagation();fav(${i})">${favs.includes(i)?'♥':'♡'}</button><div onclick="detail(${i})"><div class="photo">${p.e}</div><div class="info"><div class="rating">★ ${p.r}</div><h3>${p.n}</h3><div class="badges"><span class="badge">${stock}</span>${p.cat.includes('sale')?'<span class="badge">عرض</span>':''}</div><div class="price">$${p.p.toFixed(2)}</div><button class="add" onclick="event.stopPropagation();detail(${i})">اختيار الخيارات</button></div></div></article>`}).join('')||'<div class="empty" style="grid-column:1/-1">لا توجد نتائج مطابقة.</div>'}function filterCat(c,b){currentCat=c;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()}function fav(i){favs=favs.includes(i)?favs.filter(x=>x!==i):[...favs,i];save();draw();notice(favs.includes(i)?'تمت الإضافة للمفضلة':'تمت الإزالة من المفضلة')}function detail(i){let p=demo[i];window.pick={i,color:p.colors[0],size:p.sizes[0],q:1};panel.innerHTML=`<button class="close" onclick="closeSheet()">✕</button><div class="photo productHero">${p.e}</div><div class="line"><div><h2 style="margin-bottom:4px">${p.n}</h2><div class="rating">★ ${p.r} · تقييم ممتاز</div></div><div class="price" style="font-size:24px">$${p.p.toFixed(2)}</div></div><p class="muted">${p.d}</p><div class="badges"><span class="badge">المخزون: ${p.stock}</span><span class="badge">استبدال سهل</span></div><div class="label">اللون</div><div class="choices">${p.colors.map((x,k)=>`<button class="choice ${k===0?'active':''}" onclick="selectChoice(this,'color','${x}')">${x}</button>`).join('')}</div><div class="label">المقاس / الخيار</div><div class="choices">${p.sizes.map((x,k)=>`<button class="choice ${k===0?'active':''}" onclick="selectChoice(this,'size','${x}')">${x}</button>`).join('')}</div><div class="label">الكمية</div><div class="qty"><button onclick="pickQty(-1)">−</button><b id="pickQty">1</b><button onclick="pickQty(1)">+</button></div><div class="divider"></div><div class="tiny">سيتم حفظ اللون والمقاس والكمية داخل السلة ويمكن تعديلها لاحقًا.</div><button class="checkout" onclick="addConfigured()">أضف إلى السلة</button><button class="secondary" onclick="fav(${i})">${favs.includes(i)?'إزالة من المفضلة':'حفظ في المفضلة'}</button>`;sheet.classList.add('open')}function selectChoice(el,k,v){el.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));el.classList.add('active');pick[k]=v}function pickQty(d){let max=demo[pick.i].stock;pick.q=Math.max(1,Math.min(max,pick.q+d));document.getElementById('pickQty').textContent=pick.q}function addConfigured(){let x=cart.find(x=>x.i===pick.i&&x.color===pick.color&&x.size===pick.size);x?x.q+=pick.q:cart.push({...pick});save();notice('أضيف المنتج بخياراتك');openCart()}function change(k,d){cart[k].q+=d;if(cart[k].q<1)cart.splice(k,1);save();openCart()}function subtotal(){return cart.reduce((s,x)=>s+demo[x.i].p*x.q,0)}function shipping(){return subtotal()>=75?0:6}function total(){return subtotal()+shipping()}function openCart(){panel.innerHTML=`<button class="close" onclick="closeSheet()">✕</button><h2>سلة مَخْرَج</h2>${cart.length?cart.map((x,k)=>`<div class="row"><span>${demo[x.i].e} <b>${demo[x.i].n}</b><br><small class="muted">${x.color} · ${x.size}</small><br><b class="price">$${(demo[x.i].p*x.q).toFixed(2)}</b></span><span class="qty"><button onclick="change(${k},-1)">−</button><b>${x.q}</b><button onclick="change(${k},1)">+</button></span></div>`).join('')+`<div class="row"><span>المجموع الفرعي</span><b>$${subtotal().toFixed(2)}</b></div><div class="row"><span>التوصيل</span><b>${shipping()?'$'+shipping().toFixed(2):'مجاني'}</b></div><div class="row"><b>الإجمالي</b><b class="price">$${total().toFixed(2)}</b></div><input class="field" id="coupon" placeholder="كود خصم"><button class="secondary" onclick="notice('سيتم ربط أكواد الخصم من لوحة الإدارة')">تطبيق الكود</button><button class="checkout" onclick="checkout()">متابعة الطلب</button>`:'<div class="empty">سلتك فارغة الآن<br><small>اختر منتجًا ثم حدّد خياراته.</small></div>'}`;sheet.classList.add('open')}function checkout(){panel.innerHTML=`<button class="close" onclick="openCart()">←</button><h2>بيانات التوصيل</h2><p class="muted">أكمل البيانات، ثم سنعرض لك مراجعة نهائية قبل الإرسال.</p><input class="field" id="cn" placeholder="الاسم الكامل"><input class="field" id="cp" inputmode="tel" placeholder="رقم الهاتف"><input class="field" id="ca" placeholder="العنوان"><input class="field" id="cc" placeholder="المدينة"><select class="field" id="delivery"><option value="توصيل عادي">توصيل عادي</option><option value="توصيل سريع">توصيل سريع</option><option value="استلام">استلام</option></select><textarea class="field" id="note" placeholder="ملاحظات للطلب (اختياري)"></textarea><label class="tiny"><input type="checkbox" id="saveAddr"> حفظ هذه البيانات على هذا الجهاز</label><div class="row"><b>إجمالي تقديري</b><b class="price">$${total().toFixed(2)}</b></div><button class="checkout" onclick="reviewOrder()">مراجعة الطلب</button>`}function reviewOrder(){let n=cn.value.trim(),p=cp.value.trim(),a=ca.value.trim(),c=cc.value.trim();if(!n||!p||!a||!c){notice('أكمل البيانات المطلوبة');return}window.pending={n,p,a,c,delivery:document.getElementById('delivery').value,note:note.value};if(saveAddr.checked)localStorage.setItem('makhraj-address',JSON.stringify(pending));panel.innerHTML=`<button class="close" onclick="checkout()">←</button><h2>المراجعة النهائية</h2><div class="row"><span class="muted">العميل</span><b>${n}</b></div><div class="row"><span class="muted">الهاتف</span><b>${p}</b></div><div class="row"><span class="muted">التوصيل</span><b>${a}، ${c}</b></div><div class="row"><span class="muted">الطريقة</span><b>${pending.delivery}</b></div>${cart.map(x=>`<div class="row"><span>${demo[x.i].n} × ${x.q}<br><small class="muted">${x.color} · ${x.size}</small></span><b>$${(demo[x.i].p*x.q).toFixed(2)}</b></div>`).join('')}<div class="row"><b>الإجمالي</b><b class="price">$${total().toFixed(2)}</b></div><button class="checkout" onclick="placeOrder()">تأكيد الطلب</button>`}function placeOrder(){let no='MK-'+String(Date.now()).slice(-6),o={no,customer:pending,items:cart.map(x=>({...x})),subtotal:subtotal(),shipping:shipping(),total:total(),status:0,date:new Date().toISOString()};orders.unshift(o);cart=[];save();panel.innerHTML=`<div class="success"><div class="light"></div><div class="muted">وصل طلبك إلى النور.</div><h2>تم استلام طلبك</h2><div class="orderNo">${no}</div><p class="muted">يمكنك تتبعه في أي وقت باستخدام رقم الطلب ورقم الهاتف.</p><button class="checkout" onclick="track('${no}')">تتبع الطلب الآن</button><button class="secondary" onclick="closeSheet()">العودة للمتجر</button></div>`}function trackingCenter(){panel.innerHTML=`<button class="close" onclick="closeSheet()">✕</button><h2>تتبع الطلب</h2><p class="muted">أدخل رقم الطلب ورقم الهاتف للتأكد من الوصول للطلب الصحيح.</p><div class="trackbox"><input class="field" id="trackNo" placeholder="رقم الطلب مثل MK-123456"><input class="field" id="trackPhone" inputmode="tel" placeholder="رقم الهاتف"><button class="checkout" onclick="findOrder()">عرض حالة الطلب</button></div><div class="divider"></div><h3>طلبات محفوظة على هذا الجهاز</h3>${orders.length?orders.map(o=>`<div class="row" onclick="track('${o.no}')"><span><b>${o.no}</b><br><small class="muted">${new Date(o.date).toLocaleDateString('ar')}</small></span><b class="price">$${o.total.toFixed(2)}</b></div>`).join(''):'<div class="empty">لا توجد طلبات محفوظة بعد.</div>'}`;sheet.classList.add('open')}function findOrder(){let no=trackNo.value.trim().toUpperCase(),ph=trackPhone.value.trim(),o=orders.find(x=>x.no===no&&x.customer.p===ph);o?track(no):notice('لم يتم العثور على طلب مطابق')}function track(no){let o=orders.find(x=>x.no===no);if(!o)return;let s=['تم استلام الطلب','تم التأكيد','قيد التجهيز','جاهز/تم الشحن','تم التسليم'];panel.innerHTML=`<button class="close" onclick="trackingCenter()">←</button><h2>${o.no}</h2><p class="muted">${new Date(o.date).toLocaleString('ar')}</p><div class="timeline">${s.map((x,i)=>`<div class="step ${i<=o.status?'done':''}"><b>${x}</b>${i===o.status?'<br><small>الحالة الحالية</small>':''}</div>`).join('')}</div><div class="row"><span>طريقة التوصيل</span><b>${o.customer.delivery}</b></div><div class="row"><span>العنوان</span><b>${o.customer.a}، ${o.customer.c}</b></div><div class="row"><b>الإجمالي</b><b class="price">$${o.total.toFixed(2)}</b></div><button class="secondary" onclick="notice('الدعم والمراسلة سيضافان في النسخة المتصلة بالخادم')">أحتاج مساعدة في هذا الطلب</button>`}function showFavs(){draw(favs.map(i=>demo[i]));scrollTo({top:250,behavior:'smooth'});notice('عرض المفضلة')}function resetHome(){currentCat='all';q.value='';document.querySelectorAll('.chip').forEach((x,i)=>x.classList.toggle('active',i===0));draw()}function closeSheet(){sheet.classList.remove('open')}q.oninput=()=>draw();save();draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
