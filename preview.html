<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مَخْرَج | MAKHRAJ</title><meta name="theme-color" content="#070a0d"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/makhraj-theme.css"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;min-height:100vh}.app{max-width:620px;margin:auto;padding:18px 18px 110px}.top{position:sticky;top:0;z-index:5;padding:10px 0;background:#070a0de8;backdrop-filter:blur(14px)}.brand,.logo,.section,.qty{display:flex;align-items:center}.brand,.section{justify-content:space-between}.logo{gap:10px}.light{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fff 0 8%,#f4d783 10%,#252c33 35%,#050607 69%);box-shadow:0 0 32px #f4d78355}.name{font-size:22px;font-weight:900}.sub{font-size:11px;color:#aab3bd}.cart{border:1px solid #ffffff18;background:#121820;color:#fff;padding:11px 14px}.hero{margin-top:18px;padding:28px 22px}.hero h1{font-size:31px;margin:0 0 8px}.muted,.hero p{color:#bac2cb;line-height:1.7}.search input,.field{width:100%;margin:8px 0;padding:15px;background:#0c1117;border:1px solid #ffffff14;color:white;font-size:16px;border-radius:14px}.chips{display:flex;gap:8px;overflow:auto}.chip{white-space:nowrap;padding:10px 14px;border:1px solid #ffffff12;background:#11171e;color:#dce1e6;border-radius:999px}.chip.active{background:#f3d781;color:#151515}.section{margin:24px 2px 12px}.section h2{margin:0;font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.product{overflow:hidden;position:relative}.photo{height:165px;background:linear-gradient(145deg,#222b35,#0b0e12);display:grid;place-items:center;font-size:45px}.info{padding:13px}.info h3{margin:0 0 5px;font-size:15px}.price{font-weight:900;color:#f3d781}.add,.checkout{width:100%;margin-top:10px;padding:13px;border:0;background:#f3d781;color:#111;font-weight:900}.heart{position:absolute;top:9px;left:9px;width:36px;height:36px;border:0;border-radius:50%;background:#080b0ebd;color:#fff;font-size:18px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#090c10ee;backdrop-filter:blur(16px);border-top:1px solid #ffffff12;display:flex;justify-content:space-around}.nav button{background:none;border:0;color:#aab3bd}.nav .on{color:#f3d781}.sheet{display:none;position:fixed;inset:0;z-index:20;background:#000a;align-items:flex-end}.sheet.open{display:flex}.panel{width:min(620px,100%);margin:auto;background:#11171e;border-radius:28px 28px 0 0;padding:20px;max-height:86vh;overflow:auto}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #ffffff12}.close,.mini{background:#242c35;border:0;color:#fff;padding:9px 12px;border-radius:12px}.empty{text-align:center;color:#9da7b1;padding:35px 5px}.qty{gap:8px}.qty button{width:31px;height:31px;border:0;border-radius:10px;background:#242c35;color:#fff}.success{text-align:center;padding:25px 8px}.success .light{width:82px;height:82px;margin:10px auto 20px}.orderNo{font-size:24px;color:#f3d781;font-weight:900;letter-spacing:1px}.timeline{margin:20px 0}.step{position:relative;padding:0 30px 22px 0;color:#8e98a3}.step:before{content:'';position:absolute;right:5px;top:4px;width:12px;height:12px;border-radius:50%;background:#38424d}.step:after{content:'';position:absolute;right:10px;top:18px;width:2px;height:26px;background:#38424d}.step:last-child:after{display:none}.step.done{color:#fff}.step.done:before{background:#f3d781;box-shadow:0 0 16px #f3d78166}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="top"><div class="brand"><div class="logo"><div class="light"></div><div><div class="name">مَخْرَج</div><div class="sub">دائمًا هناك مخرج</div></div></div><button class="cart" onclick="openCart()">السلة · <b id="count">0</b></button></div></div><section class="hero makhraj-card"><h1>من العتمة، يبدأ النور.</h1><p>اكتشف ما يناسبك. تجربة عربية هادئة، سريعة، وواضحة حتى آخر خطوة.</p></section><div class="search"><input id="q" placeholder="ابحث عن منتج…"></div><div class="chips"><button class="chip active">الكل</button><button class="chip">وصل حديثًا</button><button class="chip">الأكثر طلبًا</button><button class="chip">عروض</button></div><div class="section"><h2>مختارات مَخْرَج</h2><span class="muted">اضغط للتفاصيل</span></div><div class="grid" id="products"></div></main><nav class="nav"><button class="on" onclick="draw()">⌂<br>الرئيسية</button><button onclick="q.focus();scrollTo(0,q.offsetTop-70)">⌕<br>استكشاف</button><button onclick="showFavs()">♡<br>المفضلة</button><button onclick="ordersView()">▣<br>طلباتي</button></nav><div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div><script>const demo=[{n:'حقيبة يومية',p:29,e:'👜',d:'حقيبة عملية بتصميم أنيق للاستخدام اليومي.'},{n:'ساعة أنيقة',p:39,e:'⌚',d:'تفاصيل بسيطة ولمسة فاخرة تناسب إطلالتك.'},{n:'عطر مميز',p:24,e:'✨',d:'اختيار مميز بهوية هادئة وحضور واضح.'},{n:'إكسسوار مختار',p:16,e:'◆',d:'قطعة مختارة لإكمال التفاصيل الصغيرة.'}];let cart=JSON.parse(localStorage.getItem('makhraj-cart-v3')||'[]'),favs=JSON.parse(localStorage.getItem('makhraj-favs')||'[]'),orders=JSON.parse(localStorage.getItem('makhraj-orders')||'[]');const count=document.getElementById('count'),products=document.getElementById('products'),q=document.getElementById('q'),sheet=document.getElementById('sheet'),panel=document.getElementById('panel');function save(){localStorage.setItem('makhraj-cart-v3',JSON.stringify(cart));localStorage.setItem('makhraj-favs',JSON.stringify(favs));localStorage.setItem('makhraj-orders',JSON.stringify(orders));count.textContent=cart.reduce((s,x)=>s+x.q,0)}function draw(a=demo){products.innerHTML=a.map(p=>{let i=demo.indexOf(p);return `<article class="product makhraj-card"><button class="heart" onclick="event.stopPropagation();fav(${i})">${favs.includes(i)?'♥':'♡'}</button><div onclick="detail(${i})"><div class="photo">${p.e}</div><div class="info"><h3>${p.n}</h3><div class="price">$${p.p.toFixed(2)}</div><button class="add" onclick="event.stopPropagation();add(${i})">أضف إلى السلة</button></div></div></article>`}).join('')}function add(i){let x=cart.find(x=>x.i===i);x?x.q++:cart.push({i,q:1});save()}function fav(i){favs=favs.includes(i)?favs.filter(x=>x!==i):[...favs,i];save();draw()}function detail(i){let p=demo[i];panel.innerHTML=`<button class="close" onclick="closeSheet()">✕</button><div class="photo" style="height:230px;border-radius:20px">${p.e}</div><h2>${p.n}</h2><div class="price" style="font-size:22px">$${p.p.toFixed(2)}</div><p class="muted">${p.d}</p><button class="checkout" onclick="add(${i});openCart()">أضف إلى السلة</button>`;sheet.classList.add('open')}function change(k,d){cart[k].q+=d;if(cart[k].q<1)cart.splice(k,1);save();openCart()}function total(){return cart.reduce((s,x)=>s+demo[x.i].p*x.q,0)}function openCart(){panel.innerHTML=`<button class="close" onclick="closeSheet()">✕</button><h2>سلة مَخْرَج</h2>${cart.length?cart.map((x,k)=>`<div class="row"><span>${demo[x.i].e} ${demo[x.i].n}<br><b class="price">$${(demo[x.i].p*x.q).toFixed(2)}</b></span><span class="qty"><button onclick="change(${k},-1)">−</button><b>${x.q}</b><button onclick="change(${k},1)">+</button></span></div>`).join('')+`<div class="row"><b>الإجمالي</b><b class="price">$${total().toFixed(2)}</b></div><button class="checkout" onclick="checkout()">متابعة الطلب</button>`:'<div class="empty">سلتك فارغة الآن<br><small>ابدأ باختيار شيء يعجبك.</small></div>'}`;sheet.classList.add('open')}function checkout(){panel.innerHTML=`<button class="close" onclick="openCart()">←</button><h2>أين نرسل طلبك؟</h2><p class="muted">أدخل بيانات التواصل والتوصيل. يمكنك مراجعة كل شيء قبل التأكيد.</p><input class="field" id="cn" placeholder="الاسم الكامل"><input class="field" id="cp" inputmode="tel" placeholder="رقم الهاتف"><input class="field" id="ca" placeholder="العنوان"><input class="field" id="cc" placeholder="المدينة"><textarea class="field" id="note" placeholder="ملاحظات للطلب (اختياري)"></textarea><div class="row"><b>إجمالي الطلب</b><b class="price">$${total().toFixed(2)}</b></div><button class="checkout" onclick="reviewOrder()">مراجعة الطلب</button>`}function reviewOrder(){let n=document.getElementById('cn').value.trim(),p=document.getElementById('cp').value.trim(),a=document.getElementById('ca').value.trim(),c=document.getElementById('cc').value.trim();if(!n||!p||!a||!c){alert('أكمل الاسم والهاتف والعنوان والمدينة');return}window.pending={n,p,a,c,note:document.getElementById('note').value};panel.innerHTML=`<button class="close" onclick="checkout()">←</button><h2>راجع طلبك</h2><div class="row"><span class="muted">العميل</span><b>${n}</b></div><div class="row"><span class="muted">الهاتف</span><b>${p}</b></div><div class="row"><span class="muted">التوصيل</span><b>${a}، ${c}</b></div>${cart.map(x=>`<div class="row"><span>${demo[x.i].n} × ${x.q}</span><b>$${(demo[x.i].p*x.q).toFixed(2)}</b></div>`).join('')}<div class="row"><b>الإجمالي</b><b class="price">$${total().toFixed(2)}</b></div><button class="checkout" onclick="placeOrder()">تأكيد الطلب</button>`}function placeOrder(){let no='MK-'+String(Date.now()).slice(-6),o={no,customer:pending,items:[...cart],total:total(),status:0,date:new Date().toISOString()};orders.unshift(o);cart=[];save();panel.innerHTML=`<div class="success"><div class="light"></div><div class="muted">وصل طلبك إلى النور.</div><h2>تم استلام طلبك</h2><div class="orderNo">${no}</div><p class="muted">احتفظ برقم الطلب لمتابعته.</p><button class="checkout" onclick="track('${no}')">تتبع الطلب</button></div>`}function track(no){let o=orders.find(x=>x.no===no);if(!o)return;let s=['تم استلام الطلب','قيد التجهيز','جاهز للشحن','مكتمل'];panel.innerHTML=`<button class="close" onclick="ordersView()">←</button><h2>${o.no}</h2><p class="muted">${new Date(o.date).toLocaleString('ar')}</p><div class="timeline">${s.map((x,i)=>`<div class="step ${i<=o.status?'done':''}"><b>${x}</b></div>`).join('')}</div><div class="row"><b>الإجمالي</b><b class="price">$${o.total.toFixed(2)}</b></div>`}function ordersView(){panel.innerHTML=`<button class="close" onclick="closeSheet()">✕</button><h2>طلباتي</h2>${orders.length?orders.map(o=>`<div class="row" onclick="track('${o.no}')"><span><b>${o.no}</b><br><small class="muted">${new Date(o.date).toLocaleDateString('ar')}</small></span><b class="price">$${o.total.toFixed(2)}</b></div>`).join(''):'<div class="empty">لا توجد طلبات محفوظة على هذا الجهاز بعد.</div>'}`;sheet.classList.add('open')}function showFavs(){draw(favs.map(i=>demo[i]));scrollTo({top:250,behavior:'smooth'})}function closeSheet(){sheet.classList.remove('open')}q.oninput=()=>draw(demo.filter(p=>p.n.includes(q.value.trim())));save();draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
