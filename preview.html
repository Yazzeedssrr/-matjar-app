<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مَخْرَج | MAKHRAJ</title><meta name="theme-color" content="#070a0d"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/makhraj-theme.css"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;min-height:100vh}.app{max-width:620px;margin:auto;padding:18px 18px 100px}.top{position:sticky;top:0;z-index:5;padding:10px 0;background:#070a0de8;backdrop-filter:blur(14px)}.brand,.logo,.section{display:flex;align-items:center}.brand,.section{justify-content:space-between}.logo{gap:10px}.light{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fff 0 8%,#f4d783 10%,#252c33 35%,#050607 69%);box-shadow:0 0 32px #f4d78355}.name{font-size:22px;font-weight:900}.sub{font-size:11px;color:#aab3bd}.cart{border:1px solid #ffffff18;background:#121820;color:#fff;padding:11px 14px;border-radius:16px}.hero{margin-top:18px;padding:28px 22px}.hero h1{font-size:31px;margin:0 0 8px}.hero p{color:#bac2cb;line-height:1.7;margin:0}.search input{width:100%;margin:16px 0;padding:16px;background:#11171e;border:1px solid #ffffff12;color:white;font-size:16px}.chips{display:flex;gap:8px;overflow:auto}.chip{white-space:nowrap;padding:10px 14px;border:1px solid #ffffff12;background:#11171e;color:#dce1e6;border-radius:999px}.chip.active{background:#f3d781;color:#151515}.section{margin:24px 2px 12px}.section h2{margin:0;font-size:19px}.section span{font-size:12px;color:#929ca7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.product{overflow:hidden}.photo{height:165px;background:linear-gradient(145deg,#222b35,#0b0e12);display:grid;place-items:center;font-size:45px}.info{padding:13px}.info h3{margin:0 0 5px;font-size:15px}.price{font-weight:900;color:#f3d781}.add{width:100%;margin-top:10px;padding:11px;border:0;background:#f3d781;color:#111;font-weight:800}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#090c10ee;backdrop-filter:blur(16px);border-top:1px solid #ffffff12;display:flex;justify-content:space-around}.nav button{background:none;border:0;color:#aab3bd}.nav .on{color:#f3d781}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="top"><div class="brand"><div class="logo"><div class="light"></div><div><div class="name">مَخْرَج</div><div class="sub">دائمًا هناك مخرج</div></div></div><button class="cart">السلة · <b id="count">0</b></button></div></div><section class="hero makhraj-card"><h1>من العتمة، يبدأ النور.</h1><p>متجر مَخْرَج — تجربة تسوق عربية سريعة ومصممة للهاتف.</p></section><div class="search"><input id="q" placeholder="ابحث عن منتج…"></div><div class="chips"><button class="chip active">الكل</button><button class="chip">وصل حديثًا</button><button class="chip">الأكثر طلبًا</button><button class="chip">عروض</button></div><div class="section"><h2>مختارات مَخْرَج</h2><span>نسخة تجريبية</span></div><div class="grid" id="products"></div></main><nav class="nav"><button class="on">⌂<br>الرئيسية</button><button>⌕<br>استكشاف</button><button>♡<br>المفضلة</button><button>▣<br>طلباتي</button></nav><script>const demo=[['حقيبة يومية','29.00','👜'],['ساعة أنيقة','39.00','⌚'],['عطر مميز','24.00','✨'],['إكسسوار مختار','16.00','◆']];let cart=JSON.parse(localStorage.getItem('makhraj-cart')||'0');const count=document.getElementById('count'),products=document.getElementById('products'),q=document.getElementById('q');function draw(a=demo){products.innerHTML=a.map(p=>`<article class="product makhraj-card"><div class="photo">${p[2]}</div><div class="info"><h3>${p[0]}</h3><div class="price">$${p[1]}</div><button class="add">أضف إلى السلة</button></div></article>`).join('');document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{cart++;localStorage.setItem('makhraj-cart',cart);count.textContent=cart})}q.oninput=()=>draw(demo.filter(p=>p[0].includes(q.value.trim())));count.textContent=cart;draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
