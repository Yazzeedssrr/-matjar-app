<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a0d"><title>احتياجك | مَخْرَج</title><link rel="stylesheet" href="assets/makhraj-theme.css"><style>*{box-sizing:border-box}body{margin:0;background:#070a0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}.app{max-width:620px;margin:auto;padding:18px 18px 90px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.back,.soft{border:1px solid #ffffff18;background:#121820;color:#fff;padding:11px 14px;border-radius:14px}.hero,.card{padding:22px;margin:14px 0}.hero{padding:30px 22px}.hero h1{font-size:34px;margin:8px 0}.muted{color:#aeb8c2;line-height:1.75}.field{width:100%;padding:17px;border-radius:16px;border:1px solid #ffffff18;background:#0c1117;color:#fff;font-size:16px}.need{min-height:125px;resize:vertical;line-height:1.6}.go{width:100%;padding:16px;border:0;border-radius:16px;background:#f3d781;color:#111;font-weight:900;font-size:16px;margin-top:12px}.examples{display:flex;gap:8px;overflow:auto;margin:12px 0}.example{min-width:210px;text-align:right;border:1px solid #ffffff12;background:#0c1117;color:#cbd2d9;padding:13px;border-radius:15px}.understood{border:1px solid #f3d78133;background:linear-gradient(145deg,#161a1c,#0d1115)}.eyebrow{font-size:11px;letter-spacing:.08em;color:#f3d781}.facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.fact{padding:7px 10px;border-radius:999px;background:#ffffff0c;border:1px solid #ffffff12;font-size:12px}.exit{position:relative;overflow:hidden}.exit.primary{border:1px solid #f3d78155}.rank{font-size:11px;color:#f3d781}.exit h2{margin:7px 0}.price{font-size:25px;font-weight:950;color:#f3d781}.checks{margin:13px 0}.check{padding:7px 0;color:#d8dde2}.why{padding:13px;border-radius:14px;background:#090d11;color:#b9c2cb;line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{padding:13px;border-radius:14px;font-weight:800}.outline{border:1px solid #ffffff18;background:#11171e;color:#fff}.gold{border:0;background:#f3d781;color:#111}.missing{text-align:center;padding:26px}.request{padding:16px;background:#0c1117;border-radius:16px;text-align:right}.tiny{font-size:11px;color:#89939d}.light{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle,#fff 0 8%,#f4d783 10%,#252c33 35%,#050607 69%);box-shadow:0 0 34px #f4d78355}.section{font-size:20px;margin:24px 2px 8px}.hidden{display:none}</style></head><body><main class="app"><div class="top"><div><b>مَخْرَج</b><div class="tiny">بين حاجتك والحل، نختصر الطريق</div></div><button class="back" onclick="location.href='preview.html?v=9'">رجوع</button></div><section class="hero makhraj-card"><div class="light"></div><div class="eyebrow">MAKHRAJ NEEDS</div><h1>قل لي ماذا تحتاج.</h1><p class="muted">لا تختَر فلاتر ولا تتعب في البحث. احكِ المشكلة كما هي: المناسبة، الوقت، الميزانية، أو حتى أنك لا تعرف ماذا تختار.</p></section><section class="card makhraj-card"><textarea id="need" class="field need" placeholder="مثال: عندي عزيمة الليلة ونسيت الهدية. معي 70 دولار وما أعرف ماذا أشتري..."></textarea><div class="examples"><button class="example" onclick="sample(this)">🎁 أحتاج هدية اليوم، بحد أقصى 50 دولار</button><button class="example" onclick="sample(this)">💸 أريد شيئًا أنيقًا لكن بأقل تكلفة ممكنة</button><button class="example" onclick="sample(this)">🤷 لا أعرف ماذا أختار لشخص عزيز</button></div><button class="go" onclick="solve()">افهم احتياجي وابحث عن مخرج</button></section><div id="output"></div></main><script>const catalog=[{n:'حقيبة يومية',p:29,r:4.8,stock:8,e:'👜',gift:7,lux:6,fast:9,cheap:7,keys:['حقيبة','عملي','يومي','أنيق','انيق'],why:'عملية ولا تحتاج معرفة مقاس دقيق.'},{n:'ساعة أنيقة',p:39,r:4.9,stock:4,e:'⌚',gift:9,lux:9,fast:8,cheap:5,keys:['ساعة','أنيق','انيق','فخم','فخمة'],why:'هدية ذات حضور واضح ومناسبة عندما تريد خيارًا أفخم.'},{n:'عطر مميز',p:24,r:4.7,stock:12,e:'✨',gift:10,lux:8,fast:10,cheap:8,keys:['عطر','رائحة','هدية','مناسبة'],why:'سهل كهدية، متوفر جيدًا ويترك مساحة من الميزانية.'},{n:'إكسسوار مختار',p:16,r:4.6,stock:2,e:'◆',gift:6,lux:5,fast:7,cheap:10,keys:['اكسسوار','إكسسوار','رخيص','بسيط'],why:'أقل تكلفة، لكنه أقل قوة كهدية رئيسية.'}];function sample(b){need.value=b.innerText.replace(/^..\s/,'');need.focus()}function intent(t){let budget=null,m=t.match(/(?:\$|دولار|ميزانيتي|معي|حد أقصى|بحد أقصى)[^0-9]{0,12}(\d+)/i)||t.match(/(\d+)\s*(?:دولار|\$)/i);if(m)budget=Number(m[1]);return{budget,gift:/هدية|عزيمة|مناسبة|شخص|زوج|زوجة|صديق|عزيز/.test(t),urgent:/اليوم|الليلة|الآن|سريع|ساعة|ساعتين|عاجل/.test(t),cheap:/أقل|رخيص|اقتصادي|توفير|اوفر|أوفر/.test(t),lux:/فخم|فاخر|أنيق|انيق|مميز/.test(t),uncertain:/لا أعرف|مش عارف|محتار|لا ادري|ما أعرف/.test(t)}}function solve(){let t=need.value.trim();if(!t){need.focus();return}let x=intent(t),possible=catalog.filter(p=>!x.budget||p.p<=x.budget).map(p=>{let s=p.r*4+(x.gift?p.gift:0)+(x.urgent?p.fast:0)+(x.cheap?p.cheap:0)+(x.lux?p.lux:0);p.keys.forEach(k=>{if(t.includes(k))s+=12});return{...p,s}}).sort((a,b)=>b.s-a.s);let facts=[x.gift?'هدية / مناسبة':null,x.urgent?'الوقت مهم':null,x.budget?'حتى $'+x.budget:null,x.cheap?'الأولوية للتوفير':null,x.lux?'تفضّل شيئًا أنيقًا':null,x.uncertain?'تحتاج مساعدة في الاختيار':null].filter(Boolean);let summary=x.gift?'تبحث عن خيار مناسب كهدية': 'تبحث عن شيء يطابق احتياجك';if(x.urgent)summary+=' والوقت مهم بالنسبة لك';if(x.budget)summary+=' ضمن ميزانية لا تتجاوز $'+x.budget;summary+='.';let html=`<section class="card understood"><div class="eyebrow">هذا ما فهمته</div><h2>${summary}</h2><div class="facts">${facts.length?facts.map(f=>`<span class="fact">${f}</span>`).join(''):'<span class="fact">احتياج مفتوح</span>'}</div><button class="soft" style="margin-top:13px" onclick="need.focus();scrollTo({top:120,behavior:'smooth'})">تعديل ما كتبته</button></section>`;if(!possible.length){html+=missing(x,t);render(html,t,x);return}let confidence=possible[0].s;let meaningful=x.gift||x.cheap||x.lux||x.urgent||possible.some(p=>p.keys.some(k=>t.includes(k)));if(!meaningful){html+=`<section class="card missing makhraj-card"><h2>لا أريد أن أخمّن عليك.</h2><p class="muted">كتالوج التجربة الحالي لا يفهم هذه الحاجة بدرجة كافية، لذلك لن أعرض منتجات عشوائية.</p>${requestBox(t)}</section>`;render(html,t,x);return}html+=`<h2 class="section">وجدت لك ${Math.min(3,possible.length)} مخارج</h2>`+possible.slice(0,3).map((p,i)=>exitCard(p,i,x)).join('');if(x.budget&&possible.every(p=>p.p>x.budget*.8))html+=`<section class="card makhraj-card"><div class="eyebrow">ملاحظة ذكية</div><b>خياراتك قريبة من سقف الميزانية.</b><p class="muted">يمكننا مستقبلًا البحث خارج كتالوجنا عن بديل أوفر بدل إجبارك على الموجود.</p></section>`;render(html,t,x)}function exitCard(p,i,x){let labels=['المخرج الأنسب','المخرج الأوفر','بديل آخر'];if(i===1&&x.lux)labels[1]='مخرج بديل';let left=x.budget?Math.max(0,x.budget-p.p):null;return`<section class="card exit ${i===0?'primary':''} makhraj-card"><div class="rank">${labels[i]}</div><div class="row"><h2>${p.e} ${p.n}</h2><div class="price">$${p.p}</div></div><div class="checks"><div class="check">✓ تقييم ${p.r}/5</div>${x.urgent?`<div class="check">✓ ${p.stock>3?'متوفر بما يكفي للتنفيذ السريع':'المخزون محدود — يحتاج تأكيد'}</div>`:''}${left!==null?`<div class="check">✓ يبقى من ميزانيتك $${left}</div>`:''}${x.gift?'<div class="check">✓ تم تقييمه كخيار هدية</div>':''}</div><div class="why"><b>لماذا هذا المخرج؟</b><br>${p.why}</div><div class="actions"><button class="gold" onclick="location.href='preview.html?v=9'">أكمل بهذا المخرج</button><button class="outline" onclick="saveExit('${p.n}')">احفظه</button></div></section>`}function requestBox(t){return`<div class="request"><b>اطلب من مَخْرَج توفير احتياجك</b><p class="muted">بدل نتيجة غير مفيدة، نحفظ الحاجة لتصبح إشارة لما يجب أن نوفره مستقبلًا.</p><button class="go" onclick="requestNeed()">سجّل هذا الاحتياج</button></div>`}function missing(x,t){return`<section class="card missing makhraj-card"><h2>لا يوجد مخرج مناسب ضمن هذه الميزانية.</h2><p class="muted">لن أقترح عليك شيئًا يتجاوز ما حددته. يمكنك تسجيل الحاجة وسنعاملها كطلب توفير.</p>${requestBox(t)}</section>`}function render(html,t,x){output.innerHTML=html;localStorage.setItem('makhraj-last-need',JSON.stringify({text:t,intent:x,at:Date.now()}));output.scrollIntoView({behavior:'smooth'})}function requestNeed(){let a=JSON.parse(localStorage.getItem('makhraj-need-requests')||'[]');a.unshift({text:need.value.trim(),at:Date.now(),status:'requested'});localStorage.setItem('makhraj-need-requests',JSON.stringify(a));alert('تم تسجيل احتياجك في هذه النسخة التجريبية.')}function saveExit(n){let a=JSON.parse(localStorage.getItem('makhraj-saved-exits')||'[]');if(!a.includes(n))a.unshift(n);localStorage.setItem('makhraj-saved-exits',JSON.stringify(a));alert('تم حفظ المخرج.')}</script></body></html>
